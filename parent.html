<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonifica Parent Settings (MVP stub)</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        max-width: 720px;
      }
      h1 { margin-bottom: 0.25rem; }
      .card {
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 1rem;
        margin-top: 1rem;
      }
      label {
        display: block;
        margin-top: 0.75rem;
      }
    </style>
  </head>
  <body>
    <h1>Parent Settings</h1>
    <p>MVP placeholder for future controls.</p>

    <div class="card">
      <label>
        <input type="checkbox" disabled checked />
        Sound enabled (controlled from main screen in MVP)
      </label>
      <label>
        <input type="checkbox" disabled />
        Limit to one palette (coming soon)
      </label>
      <label>
        <input type="checkbox" disabled />
        Low stimulation mode (coming soon)
      </label>
    </div>
  </body>
</html>
