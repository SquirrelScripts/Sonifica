<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sonifica</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar" role="banner">
      <h1>Sonifica</h1>
      <div class="controls" role="group" aria-label="Sound palette">
        <button class="palette-btn active" data-palette="bells">Bells</button>
        <button class="palette-btn" data-palette="drums">Drums</button>
        <button class="palette-btn" data-palette="animals">Animals</button>
      </div>
      <button id="muteBtn" aria-pressed="false" class="mute-btn">🔊 Sound On</button>
    </header>

    <main>
      <section class="pad-grid" aria-label="Sound pads">
        <button class="pad pad-1" data-pad="0" aria-label="Pad 1"></button>
        <button class="pad pad-2" data-pad="1" aria-label="Pad 2"></button>
        <button class="pad pad-3" data-pad="2" aria-label="Pad 3"></button>
        <button class="pad pad-4" data-pad="3" aria-label="Pad 4"></button>
        <button class="pad pad-5" data-pad="4" aria-label="Pad 5"></button>
        <button class="pad pad-6" data-pad="5" aria-label="Pad 6"></button>
      </section>
      <p class="hint">Tap and slide your fingers across the colors ✨</p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
